<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b5bd6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed square: phones round the corners themselves. Bars stay inside the
       central safe zone so "maskable" crops (circles, squircles) don't cut them. -->
  <rect width="512" height="512" fill="url(#g)"/>
  <rect x="146" y="262" width="56" height="112" rx="28" fill="#fff"/>
  <rect x="228" y="198" width="56" height="176" rx="28" fill="#fff"/>
  <rect x="310" y="138" width="56" height="236" rx="28" fill="#fff"/>
</svg>
