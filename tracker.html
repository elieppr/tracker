<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #e0e0e0;
        }
        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }
        .setup-screen {
            background: white;
            padding: 40px;
            border-radius: 8px;
            max-width: 500px;
            margin: 40px auto;
            border: 1px solid #e0e0e0;
        }
        .setup-screen h2 {
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 6px;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: monospace;
        }
        .form-group input:focus {
            outline: none;
            border-color: #2563eb;
        }
        .form-group p {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }
        .btn {
            background: #2563eb;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            width: 100%;
        }
        .btn:hover {
            background: #1d4ed8;
        }
        .dashboard {
            display: none;
        }
        .dashboard.active {
            display: block;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            text-align: center;
        }
        .stat-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .stat-value {
            font-size: 28px;
            font-weight: 600;
            color: #2563eb;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            margin-bottom: 20px;
        }
        .card h2 {
            font-size: 18px;
            margin-bottom: 16px;
        }
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 12px;
        }
        .form-group-inline {
            margin-bottom: 0;
        }
        .form-group-inline label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 4px;
        }
        .form-group-inline input,
        .form-group-inline select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        table th {
            background: #f9f9f9;
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
            font-weight: 600;
        }
        table td {
            padding: 10px;
            border-bottom: 1px solid #f0f0f0;
        }
        .error {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            border: 1px solid #fcc;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
        }
        .badge-Habit {
            background: #dbeafe;
            color: #1e40af;
        }
        .badge-Health {
            background: #dcfce7;
            color: #166534;
        }
        .badge-Time {
            background: #fed7aa;
            color: #92400e;
        }
        .logout {
            background: #ef4444;
        }
        .logout:hover {
            background: #dc2626;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Tracker Dashboard</h1>
            <p>Track your habits, health, and time</p>
        </div>

        <div id="error-container"></div>

        <div id="setup-screen" class="setup-screen">
            <h2>Connect Your Tracker</h2>
            <form onsubmit="handleSetup(event)">
                <div class="form-group">
                    <label>Database ID</label>
                    <input id="setup-dbid" type="text" placeholder="3e55f578c264807c9176e7b9528cad77">
                    <p>From your Notion database URL</p>
                </div>
                <div class="form-group">
                    <label>Integration Token</label>
                    <input id="setup-token" type="password" placeholder="ntn_...">
                    <p>Your Notion integration token (starts with ntn_)</p>
                </div>
                <button type="submit" class="btn">Connect</button>
            </form>
        </div>

        <div id="dashboard" class="dashboard">
            <div class="stats-grid" id="stats-grid"></div>

            <div class="card">
                <h2>Add Entry</h2>
                <form onsubmit="handleAddEntry(event)">
                    <div class="form-row">
                        <div class="form-group-inline">
                            <label>Date</label>
                            <input id="entry-date" type="date">
                        </div>
                        <div class="form-group-inline">
                            <label>Tracker Name</label>
                            <input id="entry-name" type="text" placeholder="e.g., Morning run">
                        </div>
                        <div class="form-group-inline">
                            <label>Category</label>
                            <select id="entry-category">
                                <option>Habit</option>
                                <option>Health</option>
                                <option>Time</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group-inline">
                            <label>Value</label>
                            <input id="entry-value" type="number" step="0.1" placeholder="0">
                        </div>
                        <div class="form-group-inline">
                            <label>Unit</label>
                            <input id="entry-unit" type="text" placeholder="km, mins, times">
                        </div>
                    </div>
                    <button type="submit" class="btn">Add Entry</button>
                </form>
            </div>

            <div class="card">
                <h2>Recent Entries</h2>
                <div id="history-container"></div>
            </div>

            <button class="btn logout" onclick="logout()">Disconnect</button>
        </div>
    </div>

    <script>
        let dbId = localStorage.getItem('tracker_dbId') || '';
        let token = localStorage.getItem('tracker_token') || '';
        let entries = [];

        const today = new Date().toISOString().split('T')[0];
        document.getElementById('entry-date').value = today;

        function showError(msg) {
            const container = document.getElementById('error-container');
            container.innerHTML = `<div class="error">${msg}</div>`;
            setTimeout(() => { container.innerHTML = ''; }, 5000);
        }

        function handleSetup(event) {
            event.preventDefault();
            dbId = document.getElementById('setup-dbid').value.trim();
            token = document.getElementById('setup-token').value.trim();

            if (!dbId || !token) {
                showError('Please enter both Database ID and Token');
                return;
            }

            localStorage.setItem('tracker_dbId', dbId);
            localStorage.setItem('tracker_token', token);
            loadData();
        }

        async function loadData() {
            try {
                document.getElementById('setup-screen').style.display = 'none';
                document.getElementById('dashboard').classList.add('active');

                const response = await fetch(`https://api.notion.com/v1/databases/${dbId}/query`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Notion-Version': '2022-06-28',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        sorts: [{ property: 'Date', direction: 'descending' }],
                        page_size: 100
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to connect: ' + response.statusText);
                }

                const data = await response.json();
                entries = data.results.map(r => ({
                    id: r.id,
                    date: r.properties.Date?.date?.start || '',
                    name: r.properties['Tracker Name']?.rich_text?.[0]?.plain_text || '',
                    category: r.properties.Category?.select?.name || '',
                    value: r.properties.Value?.number || 0,
                    unit: r.properties.Unit?.rich_text?.[0]?.plain_text || ''
                })).filter(e => e.name);

                renderStats();
                renderHistory();
            } catch (err) {
                showError('Error: ' + err.message);
                localStorage.removeItem('tracker_dbId');
                localStorage.removeItem('tracker_token');
                dbId = '';
                token = '';
                document.getElementById('setup-screen').style.display = 'block';
                document.getElementById('dashboard').classList.remove('active');
            }
        }

        function renderStats() {
            const now = new Date();
            const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);

            const stats = {
                total: entries.length,
                thisWeek: entries.filter(e => new Date(e.date) >= weekAgo).length,
                habits: entries.filter(e => e.category === 'Habit').length,
                health: entries.filter(e => e.category === 'Health').length,
                time: entries.filter(e => e.category === 'Time').length
            };

            const html = `
                <div class="stat-card">
                    <div class="stat-label">Total</div>
                    <div class="stat-value">${stats.total}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">This Week</div>
                    <div class="stat-value">${stats.thisWeek}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Habits</div>
                    <div class="stat-value">${stats.habits}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Health</div>
                    <div class="stat-value">${stats.health}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Time</div>
                    <div class="stat-value">${stats.time}</div>
                </div>
            `;
            document.getElementById('stats-grid').innerHTML = html;
        }

        function renderHistory() {
            if (entries.length === 0) {
                document.getElementById('history-container').innerHTML = '<p style="color: #999;">No entries yet. Add one above!</p>';
                return;
            }

            let html = '<table><thead><tr><th>Date</th><th>Tracker</th><th>Category</th><th>Value</th></tr></thead><tbody>';
            entries.slice(0, 50).forEach(e => {
                const dateStr = new Date(e.date).toLocaleDateString();
                html += `<tr>
                    <td>${dateStr}</td>
                    <td>${e.name}</td>
                    <td><span class="badge badge-${e.category}">${e.category}</span></td>
                    <td>${e.value} ${e.unit}</td>
                </tr>`;
            });
            html += '</tbody></table>';
            document.getElementById('history-container').innerHTML = html;
        }

        async function handleAddEntry(event) {
            event.preventDefault();

            const name = document.getElementById('entry-name').value.trim();
            if (!name) {
                showError('Please enter a tracker name');
                return;
            }

            try {
                const date = document.getElementById('entry-date').value;
                const category = document.getElementById('entry-category').value;
                const value = parseFloat(document.getElementById('entry-value').value) || 0;
                const unit = document.getElementById('entry-unit').value.trim();

                const response = await fetch('https://api.notion.com/v1/pages', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Notion-Version': '2022-06-28',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        parent: { database_id: dbId },
                        properties: {
                            Date: { date: { start: date } },
                            'Tracker Name': { rich_text: [{ text: { content: name } }] },
                            Category: { select: { name: category } },
                            Value: { number: value },
                            Unit: { rich_text: [{ text: { content: unit } }] }
                        }
                    })
                });

                if (!response.ok) throw new Error('Failed to add entry');

                document.getElementById('entry-name').value = '';
                document.getElementById('entry-value').value = '';
                document.getElementById('entry-unit').value = '';
                document.getElementById('entry-date').value = today;

                await loadData();
            } catch (err) {
                showError('Error: ' + err.message);
            }
        }

        function logout() {
            localStorage.removeItem('tracker_dbId');
            localStorage.removeItem('tracker_token');
            dbId = '';
            token = '';
            entries = [];
            document.getElementById('setup-screen').style.display = 'block';
            document.getElementById('dashboard').classList.remove('active');
            document.getElementById('error-container').innerHTML = '';
            document.getElementById('setup-dbid').value = '';
            document.getElementById('setup-token').value = '';
        }

        if (dbId && token) {
            loadData();
        }
    </script>
</body>
</html>
