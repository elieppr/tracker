<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker Dashboard</title>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.10.0/recharts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #e0e0e0;
        }
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        .header p {
            color: #666;
            font-size: 14px;
        }
        .setup-form {
            background: white;
            padding: 30px;
            border-radius: 8px;
            max-width: 500px;
            margin: 40px auto;
            border: 1px solid #e0e0e0;
        }
        .setup-form h2 {
            margin-bottom: 20px;
            font-size: 20px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 6px;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: monospace;
        }
        .form-group input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .form-group p {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }
        .btn {
            background: #2563eb;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            width: 100%;
        }
        .btn:hover {
            background: #1d4ed8;
        }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }
        .stat-card {
            display: flex;
            flex-direction: column;
        }
        .stat-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-value {
            font-size: 32px;
            font-weight: 600;
            color: #2563eb;
        }
        .quick-add {
            grid-column: 1 / -1;
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }
        .quick-add h2 {
            font-size: 18px;
            margin-bottom: 16px;
        }
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 12px;
        }
        .form-group-inline {
            margin-bottom: 0;
        }
        .form-group-inline label {
            font-size: 12px;
            margin-bottom: 4px;
        }
        .form-group-inline input,
        .form-group-inline select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
        }
        .chart-container {
            grid-column: 1 / -1;
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }
        .chart-container h3 {
            margin-bottom: 16px;
            font-size: 16px;
        }
        .table-container {
            grid-column: 1 / -1;
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            overflow-x: auto;
        }
        table {
            width: 100%;
            font-size: 13px;
            border-collapse: collapse;
        }
        table th {
            background: #f9f9f9;
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
            font-weight: 600;
        }
        table td {
            padding: 10px;
            border-bottom: 1px solid #f0f0f0;
        }
        .error {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            border: 1px solid #fcc;
            font-size: 14px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
        }
        .badge-habit {
            background: #dbeafe;
            color: #1e40af;
        }
        .badge-health {
            background: #dcfce7;
            color: #166534;
        }
        .badge-time {
            background: #fed7aa;
            color: #92400e;
        }
        .logout {
            background: #ef4444;
            margin-top: 20px;
        }
        .logout:hover {
            background: #dc2626;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script>
        const { useState, useEffect, useRef } = React;
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, BarChart, Bar } = Recharts;

        function App() {
            const [dbId, setDbId] = useState(() => localStorage.getItem('tracker_dbId') || '');
            const [token, setToken] = useState(() => localStorage.getItem('tracker_token') || '');
            const [entries, setEntries] = useState([]);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [formData, setFormData] = useState({
                date: new Date().toISOString().split('T')[0],
                name: '',
                category: 'Habit',
                value: '',
                unit: ''
            });

            const saveCredentials = (id, tok) => {
                localStorage.setItem('tracker_dbId', id);
                localStorage.setItem('tracker_token', tok);
            };

            const handleSetupSubmit = (e) => {
                e.preventDefault();
                if (dbId.trim() && token.trim()) {
                    saveCredentials(dbId, token);
                    fetchData(dbId, token);
                }
            };

            const fetchData = async (id, tok) => {
                setLoading(true);
                setError('');
                try {
                    const response = await fetch(`https://api.notion.com/v1/databases/${id}/query`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${tok}`,
                            'Notion-Version': '2022-06-28',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            sorts: [{ property: 'Date', direction: 'descending' }],
                            page_size: 100
                        })
                    });

                    if (!response.ok) throw new Error('Failed to fetch entries');
                    const data = await response.json();
                    const parsed = data.results.map(r => ({
                        id: r.id,
                        date: r.properties.Date?.date?.start || '',
                        name: r.properties['Tracker Name']?.rich_text?.[0]?.plain_text || '',
                        category: r.properties.Category?.select?.name || '',
                        value: r.properties.Value?.number || 0,
                        unit: r.properties.Unit?.rich_text?.[0]?.plain_text || ''
                    })).filter(e => e.name);
                    setEntries(parsed);
                } catch (e) {
                    setError(e.message);
                }
                setLoading(false);
            };

            const handleAddEntry = async (e) => {
                e.preventDefault();
                if (!formData.name.trim()) {
                    setError('Please enter a tracker name');
                    return;
                }

                try {
                    await fetch('https://api.notion.com/v1/pages', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Notion-Version': '2022-06-28',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            parent: { database_id: dbId },
                            properties: {
                                Date: { date: { start: formData.date } },
                                'Tracker Name': { rich_text: [{ text: { content: formData.name } }] },
                                Category: { select: { name: formData.category } },
                                Value: { number: parseFloat(formData.value) || 0 },
                                Unit: { rich_text: [{ text: { content: formData.unit } }] }
                            }
                        })
                    });

                    setFormData({
                        date: new Date().toISOString().split('T')[0],
                        name: '',
                        category: 'Habit',
                        value: '',
                        unit: ''
                    });
                    await fetchData(dbId, token);
                } catch (e) {
                    setError('Failed to add entry: ' + e.message);
                }
            };

            if (!dbId || !token) {
                return (
                    <div className="container">
                        <div className="setup-form">
                            <h2>Connect Your Tracker</h2>
                            <form onSubmit={handleSetupSubmit}>
                                <div className="form-group">
                                    <label>Database ID</label>
                                    <input
                                        type="text"
                                        value={dbId}
                                        onChange={(e) => setDbId(e.target.value)}
                                        placeholder="3e55f578c264807c9176e7b9528cad77"
                                    />
                                    <p>From your Notion database URL</p>
                                </div>
                                <div className="form-group">
                                    <label>Integration Token</label>
                                    <input
                                        type="password"
                                        value={token}
                                        onChange={(e) => setToken(e.target.value)}
                                        placeholder="ntn_..."
                                    />
                                    <p>Your Notion integration token</p>
                                </div>
                                <button type="submit" className="btn">Connect</button>
                            </form>
                        </div>
                    </div>
                );
            }

            const stats = {
                total: entries.length,
                habits: entries.filter(e => e.category === 'Habit').length,
                health: entries.filter(e => e.category === 'Health').length,
                time: entries.filter(e => e.category === 'Time').length,
                thisWeek: entries.filter(e => {
                    const entryDate = new Date(e.date);
                    const weekAgo = new Date();
                    weekAgo.setDate(weekAgo.getDate() - 7);
                    return entryDate >= weekAgo;
                }).length
            };

            const chartData = entries.slice(0, 14).reverse().map(e => ({
                date: new Date(e.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }),
                [e.name]: e.value
            }));

            return (
                <div className="container">
                    <div className="header">
                        <h1>Tracker Dashboard</h1>
                        <p>Track your habits, health, and time</p>
                    </div>

                    {error && <div className="error">{error}</div>}

                    <div className="dashboard">
                        <div className="card stat-card">
                            <div className="stat-label">Total Entries</div>
                            <div className="stat-value">{stats.total}</div>
                        </div>
                        <div className="card stat-card">
                            <div className="stat-label">This Week</div>
                            <div className="stat-value">{stats.thisWeek}</div>
                        </div>
                        <div className="card stat-card">
                            <div className="stat-label">Habits</div>
                            <div className="stat-value">{stats.habits}</div>
                        </div>
                        <div className="card stat-card">
                            <div className="stat-label">Health</div>
                            <div className="stat-value">{stats.health}</div>
                        </div>
                    </div>

                    <div className="quick-add">
                        <h2>Add Entry</h2>
                        <form onSubmit={handleAddEntry}>
                            <div className="form-row">
                                <div className="form-group-inline">
                                    <label>Date</label>
                                    <input
                                        type="date"
                                        value={formData.date}
                                        onChange={(e) => setFormData({...formData, date: e.target.value})}
                                    />
                                </div>
                                <div className="form-group-inline">
                                    <label>What are you tracking?</label>
                                    <input
                                        type="text"
                                        value={formData.name}
                                        onChange={(e) => setFormData({...formData, name: e.target.value})}
                                        placeholder="e.g., Morning run"
                                    />
                                </div>
                                <div className="form-group-inline">
                                    <label>Category</label>
                                    <select
                                        value={formData.category}
                                        onChange={(e) => setFormData({...formData, category: e.target.value})}
                                    >
                                        <option>Habit</option>
                                        <option>Health</option>
                                        <option>Time</option>
                                    </select>
                                </div>
                            </div>
                            <div className="form-row">
                                <div className="form-group-inline">
                                    <label>Value</label>
                                    <input
                                        type="number"
                                        step="0.1"
                                        value={formData.value}
                                        onChange={(e) => setFormData({...formData, value: e.target.value})}
                                        placeholder="0"
                                    />
                                </div>
                                <div className="form-group-inline">
                                    <label>Unit</label>
                                    <input
                                        type="text"
                                        value={formData.unit}
                                        onChange={(e) => setFormData({...formData, unit: e.target.value})}
                                        placeholder="km, mins, times"
                                    />
                                </div>
                            </div>
                            <button type="submit" className="btn">Add Entry</button>
                        </form>
                    </div>

                    {chartData.length > 0 && (
                        <div className="chart-container">
                            <h3>Recent Activity</h3>
                            <div style={{width: '100%', height: 300}}>
                                <ResponsiveContainer width="100%" height="100%">
                                    <LineChart data={chartData}>
                                        <CartesianGrid strokeDasharray="3 3" stroke="#e0e0e0" />
                                        <XAxis dataKey="date" stroke="#999" style={{fontSize: 12}} />
                                        <YAxis stroke="#999" style={{fontSize: 12}} />
                                        <Tooltip contentStyle={{backgroundColor: 'white', border: '1px solid #ddd', borderRadius: 6}} />
                                        <Legend />
                                        {Object.keys(chartData[0] || {}).filter(k => k !== 'date').slice(0, 5).map((key, i) => (
                                            <Line key={key} type="monotone" dataKey={key} stroke={['#2563eb', '#7c3aed', '#dc2626', '#ea580c', '#16a34a'][i]} />
                                        ))}
                                    </LineChart>
                                </ResponsiveContainer>
                            </div>
                        </div>
                    )}

                    {entries.length > 0 && (
                        <div className="table-container">
                            <h3>History</h3>
                            <table>
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Tracker</th>
                                        <th>Category</th>
                                        <th>Value</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {entries.slice(0, 50).map(entry => (
                                        <tr key={entry.id}>
                                            <td>{new Date(entry.date).toLocaleDateString()}</td>
                                            <td>{entry.name}</td>
                                            <td>
                                                <span className={`badge badge-${entry.category.toLowerCase()}`}>
                                                    {entry.category}
                                                </span>
                                            </td>
                                            <td>{entry.value} {entry.unit}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}

                    <div style={{marginTop: 20}}>
                        <button className="btn logout" onClick={() => {
                            localStorage.removeItem('tracker_dbId');
                            localStorage.removeItem('tracker_token');
                            setDbId('');
                            setToken('');
                            setEntries([]);
                        }}>Disconnect</button>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
