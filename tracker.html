<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #e0e0e0;
        }
        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
            background: white;
            padding: 0 20px;
            border-radius: 8px 8px 0 0;
        }
        .tab-btn {
            padding: 12px 16px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #666;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
        }
        .tab-btn.active {
            color: #2563eb;
            border-bottom-color: #2563eb;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .setup-screen {
            background: white;
            padding: 40px;
            border-radius: 8px;
            max-width: 500px;
            margin: 40px auto;
            border: 1px solid #e0e0e0;
        }
        .setup-screen h2 {
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 6px;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: monospace;
        }
        .form-group input:focus {
            outline: none;
            border-color: #2563eb;
        }
        .form-group p {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }
        .btn {
            background: #2563eb;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
        }
        .btn:hover {
            background: #1d4ed8;
        }
        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }
        .btn-danger {
            background: #ef4444;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .dashboard {
            display: none;
        }
        .dashboard.active {
            display: block;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: white;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            text-align: center;
        }
        .stat-label {
            font-size: 11px;
            color: #666;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .stat-value {
            font-size: 24px;
            font-weight: 600;
            color: #2563eb;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            margin-bottom: 20px;
        }
        .card h2 {
            font-size: 18px;
            margin-bottom: 16px;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 12px;
        }
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 12px;
        }
        .form-group-inline {
            margin-bottom: 0;
        }
        .form-group-inline label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 4px;
        }
        .form-group-inline input,
        .form-group-inline select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
        }
        .timeline {
            display: flex;
            flex-direction: column;
            gap: 0;
        }
        .timeline-entry {
            background: white;
            border: 1px solid #e0e0e0;
            border-top: none;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }
        .timeline-entry:first-child {
            border-top: 1px solid #e0e0e0;
            border-radius: 8px 8px 0 0;
        }
        .timeline-entry:last-child {
            border-radius: 0 0 8px 8px;
        }
        .timeline-entry:hover {
            background: #f9f9f9;
        }
        .entry-left {
            flex: 1;
        }
        .entry-date {
            font-size: 11px;
            color: #999;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .entry-name {
            font-weight: 500;
            font-size: 14px;
            margin-bottom: 4px;
        }
        .entry-meta {
            font-size: 12px;
            color: #666;
        }
        .entry-value {
            font-weight: 600;
            font-size: 16px;
            color: #2563eb;
            margin-left: 20px;
            min-width: 80px;
            text-align: right;
        }
        .error {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            border: 1px solid #fcc;
        }
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 500;
        }
        .tracker-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .tracker-item {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .tracker-info {
            flex: 1;
        }
        .tracker-name {
            font-weight: 500;
            font-size: 13px;
        }
        .tracker-unit {
            font-size: 11px;
            color: #666;
        }
        .timeline-scroll {
            height: 600px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Tracker Dashboard</h1>
            <p>Track habits, health metrics, and time spent</p>
        </div>

        <div id="error-container"></div>

        <div id="setup-screen" class="setup-screen">
            <h2>Connect Your Tracker</h2>
            <form onsubmit="handleSetup(event)">
                <div class="form-group">
                    <label>Database ID</label>
                    <input id="setup-dbid" type="text" placeholder="3e55f578c264807c9176e7b9528cad77">
                    <p>From your Notion database URL</p>
                </div>
                <div class="form-group">
                    <label>Integration Token</label>
                    <input id="setup-token" type="password" placeholder="ntn_...">
                    <p>Your Notion integration token</p>
                </div>
                <button type="submit" class="btn">Connect</button>
            </form>
        </div>

        <div id="dashboard" class="dashboard">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('overview')">Overview</button>
                <button class="tab-btn" onclick="switchTab('timeline')">Timeline</button>
                <button class="tab-btn" onclick="switchTab('trackers')">Manage Trackers</button>
            </div>

            <!-- OVERVIEW TAB -->
            <div id="overview" class="tab-content active">
                <div class="stats-grid" id="stats-grid"></div>

                <div class="card">
                    <h2>Quick Add Entry</h2>
                    <form onsubmit="handleAddEntry(event)">
                        <div class="form-row">
                            <div class="form-group-inline">
                                <label>Date</label>
                                <input id="entry-date" type="date">
                            </div>
                            <div class="form-group-inline">
                                <label>Tracker</label>
                                <select id="entry-name">
                                    <option value="">Select a tracker...</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group-inline">
                                <label>Value</label>
                                <input id="entry-value" type="number" step="0.1" placeholder="0">
                            </div>
                            <div class="form-group-inline">
                                <label>Notes</label>
                                <input id="entry-notes" type="text" placeholder="Optional">
                            </div>
                        </div>
                        <button type="submit" class="btn">Add Entry</button>
                    </form>
                </div>
            </div>

            <!-- TIMELINE TAB -->
            <div id="timeline" class="tab-content">
                <div class="card">
                    <h2>Entry Timeline</h2>
                    <div class="timeline-scroll">
                        <div class="timeline" id="timeline-container"></div>
                    </div>
                </div>
            </div>

            <!-- MANAGE TRACKERS TAB -->
            <div id="trackers" class="tab-content">
                <div class="card">
                    <h2>Your Trackers</h2>
                    <div class="tracker-list" id="tracker-list"></div>
                    <h3 style="margin-top: 20px; margin-bottom: 16px; font-size: 16px;">Add New Tracker</h3>
                    <form onsubmit="handleAddTracker(event)">
                        <div class="form-row">
                            <div class="form-group-inline">
                                <label>Tracker Name</label>
                                <input id="tracker-new-name" type="text" placeholder="e.g., Sleep Score">
                            </div>
                            <div class="form-group-inline">
                                <label>Unit</label>
                                <input id="tracker-new-unit" type="text" placeholder="e.g., hours, points, times">
                            </div>
                            <div class="form-group-inline">
                                <label>Category</label>
                                <select id="tracker-new-category">
                                    <option>Habit</option>
                                    <option>Health</option>
                                    <option>Time</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" class="btn">Add Tracker</button>
                    </form>
                </div>

                <div class="card">
                    <button class="btn btn-danger" onclick="logout()">Disconnect Account</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let dbId = localStorage.getItem('tracker_dbId') || '';
        let token = localStorage.getItem('tracker_token') || '';
        let entries = [];
        let customTrackers = JSON.parse(localStorage.getItem('tracker_custom') || '[]');

        const defaultTrackers = [
            { name: 'Morning Run', unit: 'km', category: 'Health' },
            { name: 'Water Intake', unit: 'glasses', category: 'Health' },
            { name: 'Meditation', unit: 'mins', category: 'Habit' },
            { name: 'Reading', unit: 'mins', category: 'Habit' }
        ];

        if (customTrackers.length === 0) {
            customTrackers = defaultTrackers;
            saveTrackers();
        }

        const today = new Date().toISOString().split('T')[0];
        document.getElementById('entry-date').value = today;

        function showError(msg) {
            const container = document.getElementById('error-container');
            container.innerHTML = `<div class="error">${msg}</div>`;
            setTimeout(() => { container.innerHTML = ''; }, 5000);
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');

            if (tab === 'timeline') {
                renderTimeline();
            } else if (tab === 'trackers') {
                renderTrackerList();
            }
        }

        function saveTrackers() {
            localStorage.setItem('tracker_custom', JSON.stringify(customTrackers));
            updateTrackerDropdown();
        }

        function updateTrackerDropdown() {
            const select = document.getElementById('entry-name');
            select.innerHTML = '<option value="">Select a tracker...</option>';
            customTrackers.forEach(t => {
                select.innerHTML += `<option value="${t.name}">${t.name}</option>`;
            });
        }

        function handleSetup(event) {
            event.preventDefault();
            dbId = document.getElementById('setup-dbid').value.trim();
            token = document.getElementById('setup-token').value.trim();

            if (!dbId || !token) {
                showError('Please enter both Database ID and Token');
                return;
            }

            localStorage.setItem('tracker_dbId', dbId);
            localStorage.setItem('tracker_token', token);
            loadData();
        }

        async function loadData() {
            try {
                document.getElementById('setup-screen').style.display = 'none';
                document.getElementById('dashboard').classList.add('active');

                const response = await fetch(`https://api.notion.com/v1/databases/${dbId}/query`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Notion-Version': '2022-06-28',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        sorts: [{ property: 'Date', direction: 'descending' }],
                        page_size: 200
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to connect: ' + response.statusText);
                }

                const data = await response.json();
                entries = data.results.map(r => ({
                    id: r.id,
                    date: r.properties.Date?.date?.start || '',
                    name: r.properties['Tracker Name']?.rich_text?.[0]?.plain_text || '',
                    category: r.properties.Category?.select?.name || '',
                    value: r.properties.Value?.number || 0,
                    unit: r.properties.Unit?.rich_text?.[0]?.plain_text || ''
                })).filter(e => e.name);

                renderStats();
                updateTrackerDropdown();
            } catch (err) {
                showError('Error: ' + err.message);
                localStorage.removeItem('tracker_dbId');
                localStorage.removeItem('tracker_token');
                dbId = '';
                token = '';
                document.getElementById('setup-screen').style.display = 'block';
                document.getElementById('dashboard').classList.remove('active');
            }
        }

        function renderStats() {
            const now = new Date();
            const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);

            const stats = {
                total: entries.length,
                thisWeek: entries.filter(e => new Date(e.date) >= weekAgo).length
            };

            let html = `
                <div class="stat-card">
                    <div class="stat-label">Total Entries</div>
                    <div class="stat-value">${stats.total}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">This Week</div>
                    <div class="stat-value">${stats.thisWeek}</div>
                </div>
            `;

            customTrackers.forEach(t => {
                const count = entries.filter(e => e.name === t.name).length;
                html += `
                    <div class="stat-card">
                        <div class="stat-label">${t.name}</div>
                        <div class="stat-value">${count}</div>
                    </div>
                `;
            });

            document.getElementById('stats-grid').innerHTML = html;
        }

        function renderTimeline() {
            if (entries.length === 0) {
                document.getElementById('timeline-container').innerHTML = '<div style="padding: 40px; text-align: center; color: #999;">No entries yet. Add one in the Overview tab!</div>';
                return;
            }

            let html = '';
            entries.forEach(e => {
                const date = new Date(e.date);
                const dateStr = date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
                const timeStr = date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                
                html += `
                    <div class="timeline-entry">
                        <div class="entry-left">
                            <div class="entry-date">${dateStr}</div>
                            <div class="entry-name">${e.name}</div>
                            <div class="entry-meta">${e.category}</div>
                        </div>
                        <div class="entry-value">${e.value} ${e.unit}</div>
                    </div>
                `;
            });

            document.getElementById('timeline-container').innerHTML = html;
        }

        function renderTrackerList() {
            let html = '';
            customTrackers.forEach((t, i) => {
                html += `
                    <div class="tracker-item">
                        <div class="tracker-info">
                            <div class="tracker-name">${t.name}</div>
                            <div class="tracker-unit">${t.unit} • ${t.category}</div>
                        </div>
                        <button type="button" class="btn btn-small btn-danger" onclick="deleteTracker(${i})">Delete</button>
                    </div>
                `;
            });
            document.getElementById('tracker-list').innerHTML = html;
        }

        function handleAddTracker(event) {
            event.preventDefault();
            const name = document.getElementById('tracker-new-name').value.trim();
            const unit = document.getElementById('tracker-new-unit').value.trim();
            const category = document.getElementById('tracker-new-category').value;

            if (!name || !unit) {
                showError('Please enter tracker name and unit');
                return;
            }

            customTrackers.push({ name, unit, category });
            saveTrackers();
            renderTrackerList();

            document.getElementById('tracker-new-name').value = '';
            document.getElementById('tracker-new-unit').value = '';
            showError(`✓ Added "${name}" tracker`);
        }

        function deleteTracker(index) {
            if (confirm('Delete this tracker?')) {
                customTrackers.splice(index, 1);
                saveTrackers();
                renderTrackerList();
            }
        }

        async function handleAddEntry(event) {
            event.preventDefault();

            const name = document.getElementById('entry-name').value;
            if (!name) {
                showError('Please select a tracker');
                return;
            }

            const value = parseFloat(document.getElementById('entry-value').value);
            if (isNaN(value)) {
                showError('Please enter a value');
                return;
            }

            const tracker = customTrackers.find(t => t.name === name);
            if (!tracker) {
                showError('Tracker not found');
                return;
            }

            try {
                const date = document.getElementById('entry-date').value;
                const response = await fetch('https://api.notion.com/v1/pages', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Notion-Version': '2022-06-28',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        parent: { database_id: dbId },
                        properties: {
                            Date: { date: { start: date } },
                            'Tracker Name': { rich_text: [{ text: { content: name } }] },
                            Category: { select: { name: tracker.category } },
                            Value: { number: value },
                            Unit: { rich_text: [{ text: { content: tracker.unit } }] }
                        }
                    })
                });

                if (!response.ok) throw new Error('Failed to add entry');

                document.getElementById('entry-value').value = '';
                document.getElementById('entry-notes').value = '';
                document.getElementById('entry-name').value = '';

                await loadData();
                showError('✓ Entry added!');
            } catch (err) {
                showError('Error: ' + err.message);
            }
        }

        function logout() {
            if (confirm('Disconnect your Notion account?')) {
                localStorage.removeItem('tracker_dbId');
                localStorage.removeItem('tracker_token');
                dbId = '';
                token = '';
                entries = [];
                document.getElementById('setup-screen').style.display = 'block';
                document.getElementById('dashboard').classList.remove('active');
                document.getElementById('error-container').innerHTML = '';
            }
        }

        if (dbId && token) {
            loadData();
        }
    </script>
</body>
</html>
